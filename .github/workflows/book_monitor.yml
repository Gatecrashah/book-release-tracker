name: Book Release Monitor

on:
  schedule:
    # Run daily at 9:00 AM UTC
    - cron: '0 9 * * *'
  
  workflow_dispatch:
    # Allow manual triggering
    
  push:
    branches: [ main ]
    paths:
      - '*.py'
      - 'authors.yaml'
      - 'scrapers/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/book_monitor.yml'

permissions:
  contents: write

# One run at a time: overlapping runs would send the same emails twice.
concurrency:
  group: book-monitor
  cancel-in-progress: false

jobs:
  monitor-releases:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "0.5.14"
        
    - name: Set up Python
      run: uv python install 3.11
        
    - name: Install dependencies
      run: uv sync
        
    - name: Run tests
      run: uv run pytest -q

    - name: Run book release monitoring
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
      run: |
        uv run python book_monitor.py
        
    - name: Commit updated release schedules
      # Runs even when monitoring failed: a scrape failure still saves the other authors' state.
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add release_schedules.json
        git diff --staged --quiet || (git commit -m "📚 Update release schedules - $(date -u +"%Y-%m-%d %H:%M UTC")" && git pull --rebase && git push)
        
    - name: Upload monitoring logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monitoring-logs
        path: book_monitor.log
        retention-days: 30